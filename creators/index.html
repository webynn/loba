<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Help teach Congolese languages. Join Loba Studio as an instructor or lesson creator.">
<title>Teach with Loba · CongoLingo</title>
<link rel="icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/testers/style.css"><link rel="stylesheet" href="/creators/style.css"><script src="/creators/app.js" defer></script>
</head>
<body>
<header><a href="/learn/">🇨🇩 CongoLingo</a><button id="language" type="button">Français</button></header>
<main>
<section class="intro">
<img src="/icons/icon-512.png" alt="Loba" width="150" height="150">
<p class="eyebrow">LOBA STUDIO</p>
<h1 data-en="Your language. Your voice. Their next lesson." data-fr="Ta langue. Ta voix. Leur prochaine leçon."></h1>
<p data-en="Help others discover Congolese languages through the words, stories and expressions you know." data-fr="Fais découvrir les langues congolaises grâce aux mots, aux histoires et aux expressions que tu connais."></p>
<div class="stripe" aria-hidden="true"></div>
</section>
<section class="card">
<h2 data-en="Teach with Loba" data-fr="Enseigne avec Loba"></h2>
<p data-en="For instructors, fluent speakers and lesson creators who want to share their language and culture." data-fr="Pour les enseignants, les personnes qui maîtrisent la langue et les créateurs de leçons qui souhaitent partager leur langue et leur culture."></p>
<ul class="contributions">
<li><span aria-hidden="true">📖</span><div><h3 data-en="Create lessons" data-fr="Crée des leçons"></h3><p data-en="Build vocabulary, translations and useful sentences around everyday topics." data-fr="Prépare du vocabulaire, des traductions et des phrases utiles sur des thèmes du quotidien."></p></div></li>
<li><span aria-hidden="true">🎙️</span><div><h3 data-en="Give words a voice" data-fr="Donne une voix aux mots"></h3><p data-en="Record pronunciations so learners can hear how the language sounds." data-fr="Enregistre la prononciation pour que les apprenants entendent les sons de la langue."></p></div></li>
<li><span aria-hidden="true">🎲</span><div><h3 data-en="Make learning playful" data-fr="Fais apprendre en jouant"></h3><p data-en="Choose vocabulary for our word games and preview puzzles in Studio." data-fr="Choisis le vocabulaire des jeux et prévisualise les grilles dans Studio."></p></div></li>
</ul>
<a class="join creator-join" href="https://studio.congolingo.com/signup" data-en="Join as a lesson creator" data-fr="Devenir créateur de leçons"></a>
<p class="hint" data-en="Create your Studio account with your email and a password. Our team reviews each request before granting access to the lesson editor." data-fr="Crée ton compte Studio avec ton e-mail et un mot de passe. Notre équipe examine chaque demande avant d’ouvrir l’accès à l’éditeur de leçons."></p>
<p><a href="https://studio.congolingo.com/studio" data-en="Already a contributor? Sign in" data-fr="Déjà contributeur ? Connecte-toi"></a></p>
<p class="hint"><a href="/testers" data-en="Want to try the mobile app? Become a tester" data-fr="Tu veux essayer l’application mobile ? Deviens testeur"></a></p>
</section>
</main>
