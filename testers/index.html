<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Loba · CongoLingo</title><link rel="icon" href="/icons/icon-192.png?v=parrot-1"><link rel="stylesheet" href="/testers/style.css"><script src="/testers/app.js" defer></script></head>
<body>
<header><a href="/learn/">🇨🇩 CongoLingo</a><button id="language" type="button">Français</button></header>
<main>
<section class="intro"><img src="/icons/icon-512.png?v=parrot-1" alt="Loba" width="150" height="150"><p class="eyebrow">LOBA · BETA</p><h1 data-en="Play. Learn. Help us grow." data-fr="Joue. Apprends. Fais grandir Loba."></h1><p data-en="Be among the first to try our mobile app and help bring Congolese languages to more people." data-fr="Teste notre application mobile en avant-première et aide-nous à faire découvrir les langues congolaises."></p><div class="stripe" aria-hidden="true"></div></section>
<section class="card">
<h2 data-en="Join the testing team" data-fr="Rejoins les testeurs"></h2>
<form id="signup">
<fieldset><legend data-en="Which phone will you use?" data-fr="Quel téléphone utiliseras-tu ?"></legend><div class="platforms"><label><input type="radio" name="platform" value="ios" required checked><span>iPhone<small>TestFlight</small></span></label><label><input type="radio" name="platform" value="android"><span>Android<small>Google Play</small></span></label></div></fieldset>
<label class="field"><span data-en="Your name" data-fr="Ton nom"></span><input name="name" autocomplete="name" maxlength="80" required></label>
<label class="field"><span id="email-label"></span><input name="email" type="email" autocomplete="email" maxlength="254" required></label>
<p class="hint" data-en="Use the email associated with your Apple Account or Google Play account. Sign up again to test on both platforms." data-fr="Utilise l’adresse de ton compte Apple ou Google Play. Inscris-toi une seconde fois pour tester sur les deux plateformes."></p>
<label class="consent"><input name="consent" type="checkbox" required><span data-en="I agree to be contacted about Loba beta testing and to have my email shared with Apple or Google to receive a testing invitation." data-fr="J’accepte d’être contacté pour tester Loba et que mon e-mail soit transmis à Apple ou Google pour recevoir une invitation."></span></label>
<button class="join" type="submit" data-en="Count me in!" data-fr="Je participe !"></button>
<p id="result" role="status" aria-live="polite"></p>
<p class="hint" data-en="We’ll send an invitation when a build is ready. Joining this list does not automatically enroll you in a store testing group." data-fr="Nous t’enverrons une invitation dès qu’une version sera prête. L’inscription à cette liste ne t’ajoute pas automatiquement au groupe de test du store."></p>
<a href="/privacy.html" data-en="Privacy policy" data-fr="Confidentialité"></a>
</form>
<p class="hint"><a href="/creators" data-en="Instructor or lesson creator? Join Loba Studio" data-fr="Enseignant ou créateur de leçons ? Rejoins Loba Studio"></a></p>
</section>
</main></body></html>
