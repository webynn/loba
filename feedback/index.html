<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback · CongoLingo</title><link rel="icon" href="/icons/icon-192.png?v=kapi-1"><link rel="stylesheet" href="/testers/style.css"><link rel="stylesheet" href="/feedback/style.css"><script src="/feedback/app.js" defer></script></head><body>
<header><a href="/learn/home">← CongoLingo</a></header><main><section class="intro"><img src="/icons/icon-512.png?v=kapi-1" alt="CongoLingo" width="150" height="150"><p class="eyebrow">CONGOLINGO · FEEDBACK</p><h1 data-en="Your voice makes CongoLingo better." data-fr="Ta voix fait grandir CongoLingo."></h1><p data-en="Found a bug? Have an idea? Tell us what happened and help shape the next adventure." data-fr="Un bug ? Une idée ? Raconte-nous et aide-nous à créer la prochaine aventure."></p><div class="stripe" aria-hidden="true"></div><p class="hint" data-en="Your feedback is private and visible to the Studio team. Please don’t include passwords or sensitive information." data-fr="Tes retours sont privés et visibles par l’équipe Studio. N’inclus aucun mot de passe ni information sensible."></p><a href="/testers" data-en="Join the testing team →" data-fr="Rejoindre les testeurs →"></a></section>
<section class="card"><h2 data-en="Let’s hear it!" data-fr="On t’écoute !"></h2><form id="feedback">
<fieldset><legend data-en="What would you like to share?" data-fr="Que souhaites-tu partager ?"></legend><div class="platforms"><label><input type="radio" name="kind" value="bug" checked><span data-en="🐛 Bug" data-fr="🐛 Bug"></span></label><label><input type="radio" name="kind" value="idea"><span data-en="💡 Idea" data-fr="💡 Idée"></span></label><label><input type="radio" name="kind" value="other"><span data-en="💬 Other" data-fr="💬 Autre"></span></label></div></fieldset>
<label class="field"><span data-en="Where were you using CongoLingo?" data-fr="Où utilisais-tu CongoLingo ?"></span><select name="platform" required><option value="ios">iPhone / iPad</option><option value="android">Android</option><option value="web">Web</option></select></label><label class="field"><span data-en="Your name" data-fr="Ton nom"></span><input name="name" type="text" maxlength="80" required></label><label class="field"><span data-en="Email for follow-up" data-fr="E-mail pour te répondre"></span><input name="email" type="email" maxlength="254" required></label><label class="field"><span data-en="In a few words…" data-fr="En quelques mots…"></span><input name="title" type="text" maxlength="120" required></label><label class="field"><span data-en="Device and app version (optional)" data-fr="Appareil et version (facultatif)"></span><input name="device" type="text" maxlength="160" ></label>
<label class="field"><span data-en="Tell us more" data-fr="Dis-nous en plus"></span><textarea name="details" rows="6" maxlength="5000" required aria-describedby="details-hint"></textarea></label><p class="hint" id="details-hint" data-en="For a bug: what did you tap, what happened, and what did you expect? Include the lesson or screen name if you can." data-fr="Pour un bug : où as-tu appuyé, que s’est-il passé et qu’attendais-tu ? Précise la leçon ou l’écran si possible."></p>
<fieldset id="image-section"><legend data-en="Screenshots (optional)" data-fr="Captures d’écran (facultatif)"></legend><label class="dropzone" id="dropzone"><input id="image-picker" type="file" accept="image/jpeg,image/png,image/webp" multiple><strong data-en="Drop images here, or choose photos" data-fr="Glisse tes images ici ou choisis des photos"></strong><span data-en="Up to 3 images · JPEG, PNG, WebP · 10 MB each" data-fr="Jusqu’à 3 images · JPEG, PNG, WebP · 10 Mo chacune"></span></label><p id="image-status" role="status" aria-live="polite"></p><div id="image-previews"></div></fieldset><label class="consent"><input name="consent" type="checkbox" required><span data-en="I agree that CongoLingo can store this feedback and contact me about it." data-fr="J’accepte que CongoLingo conserve ce retour et me contacte à ce sujet."></span></label><button class="join" type="submit" data-en="Send feedback →" data-fr="Envoyer mon retour →"></button><p id="result" role="status" aria-live="polite"></p><a href="/privacy.html" data-en="Privacy policy" data-fr="Confidentialité"></a></form></section></main><footer><button id="language" type="button">Français</button></footer></body></html>
